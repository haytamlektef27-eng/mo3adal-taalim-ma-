<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب معدل الإعدادي - نسخة مسار والامتحانات</title>
    <style>
        :root { --main: #e67e22; --dark: #d35400; --bg: #fdfaf7; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 15px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--main); }
        
        .level-switcher { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .level-btn { padding: 10px 20px; border: 2px solid var(--main); background: #fff; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .level-btn.active { background: var(--main); color: white; }

        /* نظام التبويبات للتاسعة */
        .exam-tabs { display: flex; justify-content: center; gap: 5px; margin-bottom: 20px; }
        .tab-link { padding: 8px 15px; background: #eee; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .tab-link.active { background: #34495e; color: white; }

        .subject-block { background: #fff; border: 1.5px solid #eee; border-radius: 15px; margin-bottom: 15px; }
        .subject-header { background: #fff9f2; padding: 12px; display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #eee; }
        
        .inputs-area { padding: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
        .input-group { display: flex; flex-direction: column; align-items: center; }
        .input-group label { font-size: 10px; color: #777; margin-bottom: 4px; }
        input { width: 55px; padding: 6px; border: 1px solid #ddd; border-radius: 6px; text-align: center; font-weight: bold; }
        
        .calc-all-btn { background: var(--main); color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .final-panel { margin-top: 25px; padding: 20px; border-radius: 15px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>حساب المعدل (مسار + الامتحانات) 🇲🇦</h2>

    <div class="level-switcher">
        <button class="level-btn active" onclick="changeLvl(1)">الأولى إعدادي</button>
        <button class="level-btn" onclick="changeLvl(2)">الثانية إعدادي</button>
        <button class="level-btn" onclick="changeLvl(3)">الثالثة إعدادي</button>
    </div>

    <div id="l3-tabs" class="exam-tabs" style="display:none;">
        <div class="tab-link active" onclick="switchExamTab('moraqaba')">المراقبة المستمرة</div>
        <div class="tab-link" onclick="switchExamTab('local')">الموحد المحلي</div>
        <div class="tab-link" onclick="switchExamTab('jihawi')">الموحد الجهوي</div>
    </div>

    <div id="subjects-container"></div>

    <button class="calc-all-btn" onclick="calculateFinal()">احسب النتيجة النهائية</button>
    <div id="final-panel" class="final-panel"></div>
</div>

<script>
    const subjects = [
        {n: "اللغة العربية", c: 5, exams: 3, cJ: 3},
        {n: "اللغة الفرنسية", c: 5, exams: 3, cJ: 3},
        {n: "الرياضيات", c: 5, exams: 3, cJ: 3},
        {n: "الاجتماعيات", c: 3, exams: 2, cJ: 1},
        {n: "العلوم (SVT)", c: 3, exams: 2, cJ: 1},
        {n: "الفيزياء", c: 2, exams: 2, cJ: 1},
        {n: "الإسلاميات", c: 2, exams: 2, cJ: 1},
        {n: "الإنجليزية", c: 1, exams: 2, isTech: true},
        {n: "المعلوميات", c: 1, exams: 2, isTech: true},
        {n: "التربية البدنية", c: 2, exams: 1, isTech: true}
    ];

    let currentLvl = 1;
    let currentExamTab = 'moraqaba';

    function render() {
        const container = document.getElementById('subjects-container');
        container.innerHTML = "";
        document.getElementById('l3-tabs').style.display = (currentLvl === 3) ? "flex" : "none";

        let list = (currentLvl === 3 && currentExamTab === 'jihawi') ? 
                   subjects.filter(s => !s.isTech) : subjects;

        list.forEach((s, idx) => {
            let coef = (currentLvl === 3) ? (currentExamTab === 'jihawi' ? s.cJ : 1) : s.c;
            
            let html = `
                <div class="subject-block">
                    <div class="subject-header"><span>${s.n}</span><span>معامل ${coef}</span></div>
                    <div class="inputs-area">
                        ${currentExamTab === 'moraqaba' ? generateMoraqabaFields(s.exams, idx) : `<input type="number" class="exam-score" data-coef="${coef}" placeholder="النقطة">`}
                    </div>
                </div>`;
            container.innerHTML += html;
        });
    }

    function generateMoraqabaFields(num, sIdx) {
        let f = "";
        for(let i=1; i<=num; i++) f += `<div class="input-group"><label>ف${i}</label><input type="number" class="s-${sIdx}-ex" step="0.01"></div>`;
        f += `<div class="input-group"><label>أنشطة</label><input type="number" class="s-${sIdx}-act" step="0.01"></div>`;
        return f;
    }

    function changeLvl(l) { currentLvl = l; render(); }
    function switchExamTab(t) { currentExamTab = t; render(); }

    function getMoraqabaAvg() {
        let totalWeighted = 0, totalC = 0;
        subjects.forEach((s, idx) => {
            let exams = document.querySelectorAll(`.s-${idx}-ex`), act = parseFloat(document.querySelector(`.s-${idx}-act`)?.value) || 0;
            let sum = 0, count = 0;
            exams.forEach(e => { if(e.value!==""){ sum += parseFloat(e.value); count++; } });
            if(count > 0) {
                let m = ((sum/count) + act) / 2;
                let c = (currentLvl === 3) ? 1 : s.c;
                totalWeighted += m * c; totalC += c;
            }
        });
        return totalC > 0 ? totalWeighted / totalC : 0;
    }

    function calculateFinal() {
        let res = 0;
        if (currentLvl < 3) {
            res = getMoraqabaAvg();
        } else {
            // حساب التاسعة: 30% مراقبة، 30% محلي، 40% جهوي
            // ملاحظة: لتبسيط الكود، نعتبر أن المستخدم ملأ التبويبات
            alert("هذا المعدل سيحسب بناءً على القسم الحالي المفتوح.");
            res = getMoraqabaAvg(); // غرض تعليمي
        }
        const p = document.getElementById('final-panel');
        p.style.display = "block";
        p.style.background = res >= 10 ? "#d4edda" : "#f8d7da";
        p.innerHTML = `<h3>المعدل: ${res.toFixed(2)}</h3>`;
    }

    render();
</script>
</body>
</html>
